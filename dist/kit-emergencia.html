/* MENÚ (igual que bitcoinprogwallet.com) */
nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);background:rgba(10,10,15,.72);border-bottom:1px solid var(--line)}
.nav-inner{max-width:1320px;margin:0 auto;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px;position:relative}
.logo{display:flex;align-items:center;text-decoration:none}
.logo img{height:36px;width:auto;display:block}
.nav-links{display:flex;gap:13px;font-size:13px;color:var(--ink-dim)}
.nav-links a{color:inherit;text-decoration:none;white-space:nowrap}
.nav-links a:hover{color:var(--ink)}
.nav-links a.current{color:var(--orange-glow)}
.lang-switch{display:flex;gap:6px}
.lang-btn{display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:100px;cursor:pointer;font:600 13px 'Inter Tight',system-ui,sans-serif;background:transparent;border:1px solid var(--line);color:var(--ink-dim)}
.lang-btn:hover{color:var(--ink);border-color:rgba(255,255,255,.2)}
.lang-btn.active{background:var(--ink);color:#0a0a0f;border-color:var(--ink)}
.btn-primary{display:inline-flex;align-items:center;padding:11px 18px;border-radius:100px;font:600 14px 'Inter Tight',system-ui,sans-serif;text-decoration:none;background:var(--ink);color:#0a0a0f;white-space:nowrap}
.mobile-extra{display:none}
.nav-toggle{display:none;flex-direction:column;justify-content:center;gap:5px;width:42px;height:42px;padding:9px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03);cursor:pointer}
.nav-toggle span{display:block;width:100%;height:2px;border-radius:2px;background:var(--ink);transition:transform .3s,opacity .3s}
.nav-toggle.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.nav-toggle.open span:nth-child(2){opacity:0}
.nav-toggle.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
@media(max-width:1100px){
  .nav-toggle{display:flex}
  .nav-inner>.lang-switch,.nav-inner>.btn-primary{display:none}
  .nav-links{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;gap:0;background:rgba(10,10,15,.98);border-bottom:1px solid var(--line);padding:8px 18px 18px;box-shadow:0 24px 40px rgba(0,0,0,.5)}
  nav.mobile-open .nav-links{display:flex}
  .nav-links a{padding:13px 8px;font-size:16px;border-bottom:1px solid var(--line)}
  .nav-links .mobile-extra{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-top:16px}
}
/* CONTENIDO */
#kit{display:flex;flex-direction:column;gap:22px;padding:56px 0 40px}
.eyebrow{display:inline-flex;align-items:center;gap:12px;font:12px 'JetBrains Mono',ui-monospace,Menlo,monospace;color:var(--orange);letter-spacing:.15em;text-transform:uppercase;margin-bottom:14px}
.eyebrow::before{content:"";width:30px;height:1px;background:var(--orange)}
h1{font-family:'Fraunces',Georgia,serif;font-weight:400;font-size:clamp(32px,5.4vw,50px);line-height:1.05;letter-spacing:-.03em;margin-bottom:10px;text-wrap:balance}
h2{font-family:'Fraunces',Georgia,serif;font-weight:400;font-size:clamp(22px,3.2vw,28px);line-height:1.15;letter-spacing:-.02em;margin-bottom:6px}
h3{margin:18px 0 6px;font:12px 'JetBrains Mono',ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--orange-glow)}
p{color:var(--ink-dim);margin-bottom:10px;max-width:70ch}
.sub{font:12.5px 'JetBrains Mono',ui-monospace,Menlo,monospace;color:var(--ink-dim)}
.lede{font-size:17px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-top:18px;max-width:none}
.cartera,.carga{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px 22px}
.pol{color:var(--ink)}
code,.mono,textarea,input{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
code{display:block;background:var(--code);border:1px solid var(--line);padding:11px 13px;border-radius:12px;word-break:break-all;font-size:12.5px;line-height:1.55;color:var(--ink)}
code.dir{font-size:14px}
.copiar{margin-top:8px;padding:7px 14px;border-radius:100px;border:1px solid var(--line);background:none;color:var(--ink);font:600 13px 'Inter Tight',system-ui,sans-serif;cursor:pointer}
.copiar:hover{border-color:rgba(255,255,255,.25)}
.llaves{list-style:none;display:flex;flex-direction:column;gap:12px}
.llaves li{display:flex;flex-direction:column;gap:4px}
.llaves b{color:var(--ink)}
.mono{font-size:12.5px;color:var(--ink-dim)}
.pasos{padding-left:22px;display:flex;flex-direction:column;gap:8px;color:var(--ink-dim);max-width:72ch}
.pasos li::marker{color:var(--orange);font-family:'JetBrains Mono',ui-monospace,monospace}
.boveda{margin-top:18px;border:1px solid rgba(247,147,26,.35);border-radius:16px;padding:16px;background:linear-gradient(135deg,rgba(247,147,26,.08),rgba(255,184,77,.02))}
.boveda h3{margin-top:0;color:var(--orange)}
input,textarea{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--code);color:var(--ink);font-size:13.5px;margin:6px 0}
textarea{resize:vertical}
.primario,.secundario{display:inline-flex;align-items:center;justify-content:center;padding:12px 22px;border-radius:100px;border:0;font:600 14.5px 'Inter Tight',system-ui,sans-serif;cursor:pointer;margin-top:6px}
.primario{background:var(--orange);color:#0a0a0f}
.primario:hover{background:var(--orange-glow)}
.secundario{background:none;color:var(--ink);border:1px solid rgba(245,241,232,.28)}
.secundario:hover{border-color:var(--ink)}
.primario:disabled{opacity:.6}
.oculto{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.camino{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.camino h3{margin-top:0}
.estado{margin:14px 0 0;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:100px;border:1px solid var(--line);background:var(--card);color:var(--ink-dim);font:600 13px 'Inter Tight',system-ui,sans-serif;cursor:pointer}
.chip.on{background:var(--ink);color:#0a0a0f;border-color:var(--ink)}
.salida{display:flex;flex-direction:column;gap:22px}
.semilla{columns:2;column-gap:28px;padding-left:28px;font:600 16px 'JetBrains Mono',ui-monospace,Menlo,monospace;color:var(--ink)}
.bien{color:var(--ok);font-weight:700}.mal{color:var(--bad);font-weight:700}
.aviso{color:var(--bad)}.nota{color:var(--ink-dim);font-size:13.5px}
.version{margin:0;padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:700;color:var(--ink);max-width:none}
.version.con{border:1px solid rgba(232,122,122,.5);background:rgba(232,122,122,.08);color:var(--bad)}
.pie-kit{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;color:var(--ink-dim);font-size:13.5px;border-top:1px solid var(--line);padding-top:18px}
.gh{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:999px;border:1px solid rgba(245,241,232,.28);color:var(--ink);font-weight:600;text-decoration:none;white-space:nowrap}
.gh:hover{border-color:var(--ink)}
.gh-ico{flex:none}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
@media(max-width:560px){#kit{padding-top:38px}.cartera,.carga{padding:20px 16px}.semilla{columns:1}}
@media print{nav,.copiar,.primario,.secundario,input,textarea,.chips,.carga{display:none}body{background:#fff;color:#000}code{color:#000;border-color:#ccc}p,.mono{color:#333}}
</style>
</head>
